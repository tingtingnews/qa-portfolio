[pytest]
# Default options for Playwright pytest runs
addopts = -v --tb=short
# Slow down execution for debugging (remove for CI)
# addopts = -v --tb=short --headed --slowmo=500

# Test discovery
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    smoke: Quick smoke-test subset
    ui: UI element visibility checks
    filters: Filter and date-range interactions
    data: Data correctness assertions

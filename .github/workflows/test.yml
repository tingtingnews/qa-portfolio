name: Run Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  SHPING_ADMIN_EMAIL: ${{ secrets.SHPING_ADMIN_EMAIL }}
  SHPING_ADMIN_PASSWORD: ${{ secrets.SHPING_ADMIN_PASSWORD }}
  SHPING_BASE_URL: "https://dev-admin.shping.com"

jobs:
  test:
    name: Playwright Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and Playwright
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright==1.52.0
          playwright install chromium --with-deps

      - name: Run Playwright tests
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --html=reports/report.html \
            --self-contained-html \
            --alluredir=reports/allure-results \
            || true

      - name: Upload pytest-html report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report
          path: reports/report.html
          retention-days: 30

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: reports/allure-results
          retention-days: 30

      - name: Install Allure CLI
        if: always()
        run: |
          curl -o allure.tgz -Ls https://github.com/allure-framework/allure2/releases/download/2.32.0/allure-2.32.0.tgz
          tar -zxf allure.tgz
          echo "$PWD/allure-2.32.0/bin" >> $GITHUB_PATH

      - name: Generate Allure HTML report
        if: always()
        run: allure generate reports/allure-results -o reports/allure-report --clean

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: reports/allure-report
          retention-days: 30